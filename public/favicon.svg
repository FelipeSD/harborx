<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#021d3a" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.3" />

  <!-- HarborX Modern Anchor Symbol -->
  <g filter="url(#glow)">
    <!-- Top Ring -->
    <circle cx="32" cy="18" r="5" stroke="url(#cyanGrad)" stroke-width="3.5" fill="none" />
    <!-- Center Dot in Ring -->
    <circle cx="32" cy="18" r="1.5" fill="#38bdf8" />

    <!-- Horizontal Crosspiece (Stock) -->
    <line x1="21" y1="27" x2="43" y2="27" stroke="url(#cyanGrad)" stroke-width="3.5" stroke-linecap="round" />

    <!-- Vertical Shank -->
    <line x1="32" y1="23" x2="32" y2="48" stroke="url(#cyanGrad)" stroke-width="3.5" stroke-linecap="round" />

    <!-- Curved Anchor Flukes (Arms) -->
    <path d="M 18 36 C 18 47 24 51 32 51 C 40 51 46 47 46 36" stroke="url(#cyanGrad)" stroke-width="3.5" stroke-linecap="round" fill="none" />

    <!-- Triangular Fluke Palms/Tips -->
    <path d="M 15 37 L 21 37 L 18 33 Z" fill="#38bdf8" />
    <path d="M 43 37 L 49 37 L 46 33 Z" fill="#38bdf8" />
  </g>
</svg>

