<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="yellowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Yellow / Amber Squircle Background -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#yellowGrad)" />
  <rect x="2" y="2" width="60" height="60" rx="16" stroke="#fef08a" stroke-width="1.5" stroke-opacity="0.5" />

  <!-- HarborX Anchor Symbol in dark navy/black (High Contrast) -->
  <g filter="url(#shadow)" stroke="#090d16" stroke-linecap="round" stroke-linejoin="round">
    <!-- Top Ring -->
    <circle cx="32" cy="18" r="5" stroke-width="4" fill="none" />
    <circle cx="32" cy="18" r="1.5" fill="#090d16" stroke="none" />

    <!-- Horizontal Crosspiece (Stock) -->
    <line x1="21" y1="27" x2="43" y2="27" stroke-width="4" />

    <!-- Vertical Shank -->
    <line x1="32" y1="23" x2="32" y2="48" stroke-width="4" />

    <!-- Curved Anchor Flukes (Arms) -->
    <path d="M 18 36 C 18 47 24 51 32 51 C 40 51 46 47 46 36" stroke-width="4" fill="none" />

    <!-- Triangular Fluke Palms/Tips -->
    <path d="M 15 37 L 21 37 L 18 33 Z" fill="#090d16" stroke="none" />
    <path d="M 43 37 L 49 37 L 46 33 Z" fill="#090d16" stroke="none" />
  </g>
</svg>
