<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" fill="none">
  <defs>
    <linearGradient id="logoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#021d3a" />
    </linearGradient>
    <linearGradient id="logoCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="logoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Icon Badge (50x50) -->
  <rect x="5" y="5" width="50" height="50" rx="14" fill="url(#logoBg)" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.3" />

  <!-- Anchor Emblem -->
  <g filter="url(#logoGlow)">
    <circle cx="30" cy="18" r="4.5" stroke="url(#logoCyan)" stroke-width="3" fill="none" />
    <circle cx="30" cy="18" r="1.5" fill="#38bdf8" />
    <line x1="20" y1="26" x2="40" y2="26" stroke="url(#logoCyan)" stroke-width="3" stroke-linecap="round" />
    <line x1="30" y1="22" x2="30" y2="44" stroke="url(#logoCyan)" stroke-width="3" stroke-linecap="round" />
    <path d="M 18 34 C 18 43 23 47 30 47 C 37 47 42 43 42 34" stroke="url(#logoCyan)" stroke-width="3" stroke-linecap="round" fill="none" />
    <path d="M 15 35 L 21 35 L 18 31 Z" fill="#38bdf8" />
    <path d="M 39 35 L 45 35 L 42 31 Z" fill="#38bdf8" />
  </g>

  <!-- HarborX Typography -->
  <text x="68" y="38" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="700" fill="#ffffff" letter-spacing="-0.5">
    Harbor<tspan fill="#38bdf8">X</tspan>
  </text>
  <text x="69" y="49" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="500" fill="#94a3b8" letter-spacing="1.5">
    DOCKER MANAGEMENT
  </text>
</svg>

