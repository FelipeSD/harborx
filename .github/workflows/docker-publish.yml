name: Build and Publish Docker Image to Docker Hub

on:
  push:
    branches:
      - main
      - master
      - 'v[0-9]+.*'
      - 'release/**'
    tags:
      - 'v*.*.*'
      - 'v*'
  workflow_dispatch:
    inputs:
      platforms:
        description: 'Target architectures to build (comma separated)'
        required: false
        default: 'linux/amd64,linux/arm64'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    name: Run Quality Checks & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun runtime
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run linter
        run: bun run lint

      - name: Run test suite
        run: bun run test

      - name: Verify build (Client + Server)
        run: |
          bun run build
          bun run build:server

  build-and-push:
    name: Build & Push Multi-Arch Docker Image
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Docker Hub secrets
        shell: bash
        run: |
          MISSING=""
          if [ -z "${{ secrets.DOCKERHUB_USERNAME }}" ]; then
            MISSING="DOCKERHUB_USERNAME"
          fi
          if [ -z "${{ secrets.DOCKERHUB_PASSWORD || secrets.DOCKERHUB_TOKEN }}" ]; then
            if [ -n "$MISSING" ]; then MISSING="$MISSING and "; fi
            MISSING="${MISSING}DOCKERHUB_PASSWORD (or DOCKERHUB_TOKEN)"
          fi
          if [ -n "$MISSING" ]; then
            echo "::error::Missing required secret(s): $MISSING. Please configure them in your GitHub repository settings under Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Set up QEMU (for multi-architecture support)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD || secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata (Tags & Labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ secrets.DOCKERHUB_REPO || 'harborx' }}
          flavor: |
            latest=auto
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' }}
            type=sha,prefix=sha-

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ github.event.inputs.platforms || 'linux/amd64,linux/arm64' }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
